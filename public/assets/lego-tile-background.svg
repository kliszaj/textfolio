<svg width="210" height="210" viewBox="31 31 210 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body-fill" x1="48" y1="42" x2="230" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F4F4"/>
      <stop offset="0.48" stop-color="#DEDEDE"/>
      <stop offset="1" stop-color="#C8C8C8"/>
    </linearGradient>
    <radialGradient id="stud-fill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(108 105) rotate(45) scale(92)">
      <stop offset="0" stop-color="#F7F7F7"/>
      <stop offset="0.54" stop-color="#E1E1E1"/>
      <stop offset="1" stop-color="#C9C9C9"/>
    </radialGradient>
    <linearGradient id="body-rim" x1="50" y1="46" x2="225" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8A8A8A" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="stud-rim" x1="100" y1="91" x2="177" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="white" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8A8A8A" stop-opacity="0.36"/>
    </linearGradient>
    <filter id="stud-shadow" x="64" y="64" width="172" height="177" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="8" dy="10" stdDeviation="8" flood-color="#111111" flood-opacity="0.28"/>
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#111111" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- The face reaches every edge of the repeat cell. Its one-pixel rim is
       drawn inward, so neighboring background bricks meet without a gutter. -->
  <rect x="31" y="31" width="210" height="210" fill="url(#body-fill)"/>
  <rect x="32" y="32" width="208" height="208" stroke="url(#body-rim)" stroke-width="2"/>
  <g filter="url(#stud-shadow)">
    <circle cx="136" cy="136" r="60" fill="url(#stud-fill)"/>
    <circle cx="136" cy="136" r="58.5" stroke="url(#stud-rim)" stroke-width="3"/>
  </g>
</svg>
